<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>متحف الألغاز - المومياوات المتسللة</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background-color: #ff6600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; position: fixed;
        }

        #game-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        #hearts-container {
            position: absolute; top: 10px; left: 10px;
            display: flex; gap: 4px; z-index: 150;
        }
        .ui-heart {
            width: 14px; height: 14px; background-color: #ff0000;
            clip-path: polygon(50% 15%, 65% 0, 85% 0, 100% 20%, 100% 40%, 50% 95%, 0 40%, 0 20%, 15% 0, 35% 0);
        }
        .ui-heart.empty { background-color: #222222; border: 1px solid #555; }

        #symbol-counter {
            position: absolute; top: 35px; left: 10px;
            background: rgba(0,0,0,0.7); color: #ffd700;
            padding: 4px 8px; border-radius: 4px; font-size: 12px;
            font-weight: bold; border: 1px solid #ffd700; z-index: 150;
        }

        #instruction-bar {
            position: absolute; top: 0; right: 0; width: 60%;
            background: rgba(0, 0, 0, 0.85); border-bottom: 2px solid #ffd700;
            border-left: 2px solid #ffd700; border-bottom-left-radius: 8px;
            padding: 8px 12px; color: #ffd700; text-align: right;
            font-size: 12px; font-weight: bold; z-index: 150; direction: rtl; line-height: 1.4;
        }

        #control-panel-right { position: absolute; bottom: 10px; right: 10px; width: 160px; height: 160px; z-index: 130; }

        .control-btn {
            position: absolute; background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; touch-action: none; font-size: 18px;
        }

        #jump { width: 45px; height: 45px; top: 5px; left: 55px; }       
        #run { width: 45px; height: 45px; top: 55px; left: 5px; }       
        #crouch { width: 45px; height: 45px; top: 55px; right: 5px; border-color: #ffd700; }    
        #flashlight-btn { width: 45px; height: 45px; bottom: 5px; left: 55px; border-color: #ffd700; color: #ffd700; } 

        #interact-btn {
            position: absolute; top: 45px; left: 45px; width: 65px; height: 65px;
            background: rgba(255, 215, 0, 0.25); border: 3px solid #ffd700; border-radius: 50%;
            color: #ffd700; font-size: 24px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 140; box-shadow: 0 0 15px #ffd700; opacity: 0.3; pointer-events: none;
        }
        #interact-label { position: absolute; bottom: -14px; font-size: 10px; color: #ffd700; white-space: nowrap; font-weight: bold; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); border: 2px solid #00ff00; border-radius: 50%;
            z-index: 200; pointer-events: none; display: none;
        }
        #crosshair::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: #00ff00; transform: translate(-50%, -50%); border-radius: 50%;
        }

        #shoot-btn {
            position: absolute; bottom: 180px; right: 30px; width: 70px; height: 70px;
            background: rgba(220, 53, 69, 0.6); border: 3px solid #dc3545; border-radius: 50%;
            color: white; font-size: 28px; display: none; align-items: center; justify-content: center;
            z-index: 150; cursor: pointer; touch-action: none; box-shadow: 0 0 15px #dc3545;
        }

        #score-board {
            position: absolute; top: 75px; left: 10px; background: rgba(0,255,0,0.2);
            color: #00ff00; padding: 4px 8px; border-radius: 4px; font-size: 12px;
            font-weight: bold; border: 1px solid #00ff00; z-index: 150; display: none;
        }

        #joystick-container {
            position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center; z-index: 130; touch-action: none; border-radius: 50%;
        }
        #joystick-knob { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.4); border: 1.5px solid rgba(255, 255, 255, 0.7); border-radius: 50%; position: absolute; pointer-events: none; }

        #jumpscare-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050403; display: none; z-index: 300; align-items: center; justify-content: center;
        }
        .mummy-scare-face { width: 100vw; height: 100vh; background: #2b2216; position: relative; animation: shake 0.04s infinite alternate; border: 15px solid #1a0000; }
        .scare-bandages { position: absolute; width: 100%; height: 25px; background: #4a3e2e; transform: rotate(-5deg); top: 15%; box-shadow: 0 5px 10px #000; }
        .scare-bandages.two { transform: rotate(8deg); top: 55%; background: #3b3224; }
        .scare-eye { position: absolute; width: 25vw; height: 25vw; background: #ff0000; border-radius: 50%; top: 28%; box-shadow: 0 0 60px #ff0000, 0 0 20px #ffffff; border: 4px solid #fff; }
        .scare-eye.left { left: 15%; } .scare-eye.right { right: 15%; }
        .scare-mouth { position: absolute; width: 60vw; height: 24vw; background: #000000; bottom: 18%; left: 50%; transform: translateX(-50%); border-radius: 40% 40% 10% 10%; }

        #gameover-black-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000000; display: none; z-index: 400; flex-direction: column; align-items: center; justify-content: center; }
        #gameover-text { color: #dc3545; font-size: 48px; font-weight: bold; text-shadow: 0 0 20px #dc3545; animation: pulse 1.5s infinite; }

        #welcome-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 600; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #ffd700; text-align: center; direction: rtl;
        }
        .popup-box {
            background: #151b26; border: 2px solid #ffd700; padding: 30px;
            border-radius: 12px; max-width: 85%; width: 350px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .popup-box h2 { margin-top: 0; color: #ffaa00; font-size: 22px; }
        .popup-box p { font-size: 16px; color: #fff; line-height: 1.5; margin: 15px 0 25px 0; }
        .popup-btn {
            background: #ffd700; color: #000; border: none; padding: 10px 25px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,215,0,0.6);
        }

        @keyframes shake { 0% { transform: translate(5px, 5px) scale(1.05); } 100% { transform: translate(-5px, -5px) scale(1.05); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <audio id="bg-music" src="level_sound.mp3" loop></audio>

    <div id="welcome-popup">
        <div class="popup-box">
            <h2>تنبيه هام</h2>
            <p>جرب الأزرار لضمان لعب جيد</p>
            <button class="popup-btn" id="start-game-btn">ابدأ اللعب</button>
        </div>
    </div>

    <div id="game-canvas"></div>

    <div id="hearts-container">
        <div class="ui-heart" id="heart-1"></div>
        <div class="ui-heart" id="heart-2"></div>
        <div class="ui-heart" id="heart-3"></div>
        <div class="ui-heart" id="heart-4"></div>
        <div class="ui-heart" id="heart-5"></div>
    </div>

    <div id="symbol-counter">الرموز: 0 / 4</div>
    <div id="score-board">النيشان: 0 / 3</div>

    <div id="instruction-bar">ابحث بجانب السيارة الحمراء عن الكرت الذهبي لفتح بوابة المتحف الفرعونية الكبرى!</div>

    <div id="crosshair"></div>
    <div id="shoot-btn">💥</div>

    <div id="jumpscare-screen">
        <div class="mummy-scare-face">
            <div class="scare-bandages"></div>
            <div class="scare-bandages two"></div>
            <div class="scare-eye left"></div>
            <div class="scare-eye right"></div>
            <div class="scare-mouth"></div>
        </div>
    </div>

    <div id="gameover-black-screen">
        <div id="gameover-text">GAME OVER</div>
    </div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>

    <div id="control-panel-right">
        <div class="control-btn" id="jump">🦘</div>
        <div class="control-btn" id="run">🏃</div>
        <div class="control-btn" id="crouch">⇩</div>
        <div class="control-btn" id="flashlight-btn">🔦</div>
        <div id="interact-btn">✋<div id="interact-label">تفاعل</div></div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

        const bgMusic = document.getElementById('bg-music');
        document.getElementById('start-game-btn').addEventListener('click', () => {
            initAudio();
            bgMusic.play().catch(e => console.log("Audio play blocked", e));
            document.getElementById('welcome-popup').style.display = 'none';
        });

        function playTone(freq, type, duration, vol=0.2) {
            if(!audioCtx) return; let osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playFootstepSound() {
            if(!audioCtx) return;
            let bufSize = audioCtx.sampleRate * 0.05, buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate), data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            let src = audioCtx.createBufferSource(); src.buffer = buf;
            let f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 250;
            let g = audioCtx.createGain(); g.gain.value = 0.02;
            src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
        }

        function playGunShot() { if(!audioCtx) return; playTone(180, 'sawtooth', 0.15, 0.4); playTone(90, 'triangle', 0.2, 0.3); }
        function playScreamSound() { if(!audioCtx) return; playTone(120, 'sawtooth', 1.0, 0.5); }
        function playCollectTone() { if(!audioCtx) return; playTone(440, 'sine', 0.15, 0.3); playTone(880, 'sine', 0.2, 0.2); }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xff6600); 

        // إضافة الخلفية الأسطوانية 360 درجة بصورة background-skyline.jpg مع لون برتقالي
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('background_skyline.jpg', (texture) => {
            const skyGeom = new THREE.CylinderGeometry(600, 600, 400, 32, 1, true);
            skyGeom.scale(-1, 1, 1); // عكس الأسطوانة لتظهر الصورة من الداخل
            const skyMat = new THREE.MeshBasicMaterial({
                map: texture,
                color: 0xff7b00 // تأثير لون برتقالي متوافق مع السماء
            });
            const skyMesh = new THREE.Mesh(skyGeom, skyMat);
            skyMesh.position.y = 100;
            scene.add(skyMesh);
        }, undefined, () => {
            console.log("Could not load background_skyline.jpg, using default orange background.");
        });

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const clock = new THREE.Clock(); 

        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffcc88, 0.7); 
        sunLight.position.set(60, 120, -100);
        scene.add(sunLight);

        const flashlight = new THREE.SpotLight(0xfff5db, 0, 70, Math.PI / 3, 0.5, 1); scene.add(flashlight);
        const flashlightTarget = new THREE.Object3D(); scene.add(flashlightTarget); flashlight.target = flashlightTarget;
        let flashlightOn = false;

        let cityFloorGroup = new THREE.Group();
        let cityMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.85 });

        let floorFront = new THREE.Mesh(new THREE.PlaneGeometry(1000, 370), cityMat); 
        floorFront.rotation.x = -Math.PI / 2; floorFront.position.set(0, 0, 57); cityFloorGroup.add(floorFront);

        let floorLeft = new THREE.Mesh(new THREE.PlaneGeometry(472, 150), cityMat); 
        floorLeft.rotation.x = -Math.PI / 2; floorLeft.position.set(-264, 0, -200); cityFloorGroup.add(floorLeft);

        let floorRight = new THREE.Mesh(new THREE.PlaneGeometry(472, 150), cityMat); 
        floorRight.rotation.x = -Math.PI / 2; floorRight.position.set(264, 0, -200); cityFloorGroup.add(floorRight);

        let floorBack = new THREE.Mesh(new THREE.PlaneGeometry(1000, 480), cityMat); 
        floorBack.rotation.x = -Math.PI / 2; floorBack.position.set(0, 0, -515); cityFloorGroup.add(floorBack);
        scene.add(cityFloorGroup);

        let colliders = []; 
        let platformColliders = []; 
        let museumMummies = [];
        let stairStepsColliders = [];
        let collectableSymbols = []; 
        let museumLasers = [];
        let spikeTraps = [];
        let targetBoxes = [];
        let flyingArrows = [];

        let hasGoldenCard = false; 
        let isMuseumGateOpen = false;
        let hasSubDJ = false;
        let collectedSymbolsCount = 0; 
        let isStairGateOpen = false; 
        let trapCooldown = false;
        let isRespawningProcess = false;

        let shotgunScore = 0;
        let shotgunChallengeDone = false;
        let targetSpawnTimer = 0;

        function createBuildingWithWindows(x, z, w, h, d, baseColor, isStaticScenery = false) {
            let bGroup = new THREE.Group();
            let mainMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color: baseColor, roughness: 0.8}));
            mainMesh.position.y = h / 2; bGroup.add(mainMesh);

            let winGeom = new THREE.BoxGeometry(0.8, 1.2, 0.1);
            let winMatOn = new THREE.MeshStandardMaterial({color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.5});
            let winMatOff = new THREE.MeshStandardMaterial({color: 0x111122});

            let rows = Math.floor(h / 5) - 1;
            let cols = Math.floor(w / 4) - 1;
            for(let r = 1; r <= rows; r++) {
                let winY = r * 5;
                for(let c = 0; c < cols; c++) {
                    let winX = -((w - 2) / 2) + (c * 4) + 1;
                    let useMat = Math.random() > 0.4 ? winMatOn : winMatOff;
                    let winF = new THREE.Mesh(winGeom, useMat); winF.position.set(winX, winY, d/2 + 0.02); bGroup.add(winF);
                    let winB = new THREE.Mesh(winGeom, useMat); winB.position.set(winX, winY, -d/2 - 0.02); bGroup.add(winB);
                }
            }
            bGroup.position.set(x, 0, z); scene.add(bGroup);
            bGroup.updateMatrixWorld(true);
            if(!isStaticScenery) { colliders.push(new THREE.Box3().setFromObject(mainMesh)); }
        }

        const shotgunMesh = new THREE.Group();
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), new THREE.MeshStandardMaterial({color: 0x111111}));
        barrel.rotation.x = Math.PI / 2; barrel.position.set(0.2, -0.2, -0.4);
        const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.3), new THREE.MeshStandardMaterial({color: 0x5c4033}));
        stock.position.set(0.2, -0.25, -0.1); shotgunMesh.add(barrel, stock);
        camera.add(shotgunMesh); scene.add(camera); shotgunMesh.visible = false;

        function createDetailedCar(x, z, colorHex) {
            let carGroup = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.5), new THREE.MeshStandardMaterial({color: colorHex})); body.position.y = 0.5; carGroup.add(body);
            let cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.5), new THREE.MeshStandardMaterial({color: 0x222222})); cabin.position.set(0, 1.15, -0.2); carGroup.add(cabin);
            let wheelGeom = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 16); let wheelMat = new THREE.MeshStandardMaterial({color: 0x111111}); wheelGeom.rotateZ(Math.PI / 2);
            let w1 = new THREE.Mesh(wheelGeom, wheelMat); w1.position.set(1.1, 0.35, 1.4);
            let w2 = new THREE.Mesh(wheelGeom, wheelMat); w2.position.set(-1.1, 0.35, 1.4);
            let w3 = new THREE.Mesh(wheelGeom, wheelMat); w3.position.set(1.1, 0.35, -1.4);
            let w4 = new THREE.Mesh(wheelGeom, wheelMat); w4.position.set(-1.1, 0.35, -1.4);
            carGroup.add(w1, w2, w3, w4); carGroup.position.set(x, 0, z); scene.add(carGroup); carGroup.updateMatrixWorld(true);
            colliders.push(new THREE.Box3().setFromObject(body));
        }

        createDetailedCar(-10, -60, 0xcc1111); 
        createDetailedCar(12, -50, 0x2244aa);  
        createDetailedCar(-25, -45, 0x333333); 
        createDetailedCar(25, -65, 0x00aa55);  

        createBuildingWithWindows(-35, -75, 18, 35, 18, 0x3a3a3d); 
        createBuildingWithWindows(35, -75, 18, 40, 18, 0x443e38);  
        createBuildingWithWindows(-55, -50, 15, 25, 15, 0x423832); 
        createBuildingWithWindows(55, -45, 20, 45, 20, 0x2d363c);  

        const goldenCardMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.9), new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.9}));
        goldenCardMesh.position.set(-8.2, 0.5, -58.5); scene.add(goldenCardMesh);

        const museumGroup = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a4d41, roughness: 0.8 });
        const innerWallMat = new THREE.MeshStandardMaterial({ color: 0x44382e });

        const frontFacadeL = new THREE.Mesh(new THREE.BoxGeometry(21, 25, 4), wallMat); frontFacadeL.position.set(-17.5, 12.5, -130); museumGroup.add(frontFacadeL);
        const frontFacadeR = new THREE.Mesh(new THREE.BoxGeometry(21, 25, 4), wallMat); frontFacadeR.position.set(17.5, 12.5, -130); museumGroup.add(frontFacadeR);
        
        const colL = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 25, 16), new THREE.MeshStandardMaterial({color: 0xd4af37})); colL.position.set(-8, 12.5, -128); museumGroup.add(colL);
        const colR = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 25, 16), new THREE.MeshStandardMaterial({color: 0xd4af37})); colR.position.set(8, 12.5, -128); museumGroup.add(colR);

        const pharaohTriangle = new THREE.Mesh(new THREE.ConeGeometry(7.5, 5.0, 4), new THREE.MeshStandardMaterial({color: 0x8b7355}));
        pharaohTriangle.scale.set(2.8, 1.2, 0.7); pharaohTriangle.position.set(0, 27.0, -129.8); museumGroup.add(pharaohTriangle);

        const redCarpet = new THREE.Mesh(new THREE.PlaneGeometry(12, 35), new THREE.MeshStandardMaterial({ color: 0xb30000 }));
        redCarpet.rotation.x = -Math.PI / 2; redCarpet.position.set(0, 0.02, -112); museumGroup.add(redCarpet);

        const mainGateMesh = new THREE.Group(); mainGateMesh.position.set(0, 0, -130); museumGroup.add(mainGateMesh);
        const leftDoorPivot = new THREE.Group(); leftDoorPivot.position.set(-8.5, 0, 0); mainGateMesh.add(leftDoorPivot);
        const leftDoorG = new THREE.Mesh(new THREE.BoxGeometry(8.5, 25, 0.8), new THREE.MeshStandardMaterial({color: 0x3d2314})); leftDoorG.position.set(4.25, 12.5, 0); leftDoorPivot.add(leftDoorG);
        const rightDoorPivot = new THREE.Group(); rightDoorPivot.position.set(8.5, 0, 0); mainGateMesh.add(rightDoorPivot);
        const rightDoorG = new THREE.Mesh(new THREE.BoxGeometry(8.5, 25, 0.8), new THREE.MeshStandardMaterial({color: 0x3d2314})); rightDoorG.position.set(-4.25, 12.5, 0); rightDoorPivot.add(rightDoorG);

        const leftOuterWall = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 132), wallMat); leftOuterWall.position.set(-27, 12.5, -195); museumGroup.add(leftOuterWall);
        const rightOuterWall = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 132), wallMat); rightOuterWall.position.set(27, 12.5, -195); museumGroup.add(rightOuterWall);
        const backOuterWall = new THREE.Mesh(new THREE.BoxGeometry(56, 25, 2), wallMat); backOuterWall.position.set(0, 12.5, -261); museumGroup.add(backOuterWall);
        const museumCeiling = new THREE.Mesh(new THREE.BoxGeometry(56, 1, 132), wallMat); museumCeiling.position.set(0, 25, -195); museumGroup.add(museumCeiling);

        const midWallL = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 60), innerWallMat); midWallL.position.set(-9, 12.5, -165); museumGroup.add(midWallL);
        const midWallR = new THREE.Mesh(new THREE.BoxGeometry(2, 25, 60), innerWallMat); midWallR.position.set(9, 12.5, -165); museumGroup.add(midWallR);

        const targetRoomBackBlock = new THREE.Mesh(new THREE.BoxGeometry(18, 25, 2), innerWallMat); targetRoomBackBlock.position.set(-18, 12.5, -194); museumGroup.add(targetRoomBackBlock); colliders.push(new THREE.Box3().setFromObject(targetRoomBackBlock));
        const rightRoomBackBlock = new THREE.Mesh(new THREE.BoxGeometry(18, 25, 2), innerWallMat); rightRoomBackBlock.position.set(18, 12.5, -194); museumGroup.add(rightRoomBackBlock); colliders.push(new THREE.Box3().setFromObject(rightRoomBackBlock));

        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a2f28, roughness: 0.9 });
        const floorCenter = new THREE.Mesh(new THREE.PlaneGeometry(20, 62), floorMat); floorCenter.rotation.x = -Math.PI / 2; floorCenter.position.set(0, 0.02, -160);
        const floorRightRoom = new THREE.Mesh(new THREE.PlaneGeometry(18, 62), floorMat); floorRightRoom.rotation.x = -Math.PI / 2; floorRightRoom.position.set(18, 0.02, -160);

                            if (!isCrouching || playerP.y > 0.85) { 
                                trapCooldown = true; 
                                instBar.innerHTML = "❌ لامست شعاع الليزر الأزرق! الخصم: قلب واحد."; 
                                respawnOutsideMuseum(); 
                            }
                        }
                    } else if (laser.type === 'SPIN_VERTICAL_BARRIER') {
                        let dx = playerP.x - laserP.x; let dz = playerP.z - laserP.z; let distanceToCenter = Math.sqrt(dx * dx + dz * dz);
                        if (distanceToCenter < 5.5) {
                            let playerAngle = Math.atan2(dz, dx); let laserAngle = laser.group.rotation.y; let angleDiff = Math.abs((playerAngle - laserAngle) % Math.PI);
                            if (angleDiff < 0.04 || angleDiff > Math.PI - 0.04) { 
                                trapCooldown = true; 
                                instBar.innerHTML = "❌ قطعت مسار الشعاع الدوار!"; 
                                respawnOutsideMuseum(); 
                            }
                        }
                    }
                }
            });

            if (!trapCooldown && gameState.startsWith("explore_museum")) {
                let pBox = new THREE.Box3(new THREE.Vector3(player.position.x-0.35, player.position.y-1.6, player.position.z-0.35), new THREE.Vector3(player.position.x+0.35, player.position.y, player.position.z+0.35));
                spikeTraps.forEach(spikeBox => {
                    if (pBox.intersectsBox(spikeBox) && player.position.y <= 1.65) {
                        trapCooldown = true; instBar.innerHTML = "❌ احترس! دُست فوق الأشواك الحادة الأرضية!";
                        respawnOutsideMuseum();
                    }
                });
            }

            museumMummies.forEach(mummy => {
                let distToPlayer = mummy.position.distanceTo(player.position);
                if (distToPlayer < 14.0 && player.position.x > -9 && player.position.x < 9) { 
                    mummy.lookAt(player.position.x, mummy.position.y, player.position.z);
                    mummy.position.addScaledVector(new THREE.Vector3().subVectors(player.position, mummy.position).normalize(), 2.5 * dt);
                    if (distToPlayer < 1.4 && !trapCooldown) { trapCooldown = true; respawnOutsideMuseum(); }
                }
            });

            rightRoomMummies.forEach((mummy, index) => {
                let distToPlayer = mummy.position.distanceTo(player.position);
                
                if (player.position.x > 9.0 && distToPlayer < 25.0) {
                    
                    let lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
                    lookDir.y = 0; lookDir.normalize();

                    let toMummy = new THREE.Vector3().subVectors(mummy.position, player.position);
                    toMummy.y = 0; toMummy.normalize();

                    let dot = lookDir.dot(toMummy);

                    if (dot < 0.45) {
                        mummy.lookAt(player.position.x, mummy.position.y, player.position.z);
                        
                        let moveDir = new THREE.Vector3().subVectors(player.position, mummy.position);
                        moveDir.y = 0; moveDir.normalize();
                        
                        let speed = 4.5; 
                        let nextX = mummy.position.x + moveDir.x * speed * dt;
                        let nextZ = mummy.position.z + moveDir.z * speed * dt;
                        
                        for (let j = 0; j < rightRoomMummies.length; j++) {
                            if (index !== j) {
                                let otherMummy = rightRoomMummies[j];
                                let distBetweenMummies = mummy.position.distanceTo(otherMummy.position);
                                if (distBetweenMummies < 1.2) { 
                                    let pushDir = new THREE.Vector3().subVectors(mummy.position, otherMummy.position).normalize();
                                    nextX += pushDir.x * 1.5 * dt;
                                    nextZ += pushDir.z * 1.5 * dt;
                                }
                            }
                        }

                        if (nextX >= 9.5 && nextX <= 26.0) { mummy.position.x = nextX; }
                        if (nextZ >= -193.0 && nextZ <= -131.0) { mummy.position.z = nextZ; }
                    }
                    
                    if (distToPlayer <= 1.65 && !trapCooldown && !isRespawningProcess) {
                        instBar.innerHTML = "❌ تسللت المومياء خلفك وأمسكت بك! تم خصم قلب واحد.";
                        respawnOutsideMuseum();
                    }
                }
            });

            let pBox = new THREE.Box3(new THREE.Vector3(player.position.x-0.4, player.position.y-1.6, player.position.z-0.4), new THREE.Vector3(player.position.x+0.4, player.position.y, player.position.z+0.4));
            let onPlatform = false;
            
            for(let plat of platformColliders) {
                if (pBox.intersectsBox(plat.box)) {
                    let targetPlatY = plat.topY + (isCrouching ? 0.6 : 1.6);
                    if (player.position.y <= targetPlatY + 0.3 && player.velocityY <= 0) { player.position.y = targetPlatY; player.velocityY = 0; player.isGrounded = true; onPlatform = true; break; }
                }
            }

            for(let step of stairStepsColliders) {
                if (pBox.intersectsBox(step.box)) {
                    let targetFloorY = step.topY + (isCrouching ? 0.6 : 1.6);
                    if(player.position.y < targetFloorY) { player.position.y = targetFloorY; player.velocityY = 0; player.isGrounded = true; onPlatform = true; }
                    break;
                }
            }

            let inLavaHole = (player.position.x > -26 && player.position.x < -10 && player.position.z > -191 && player.position.z < -151);

            if (!onPlatform) { player.velocityY -= 45.0 * dt; player.position.y += player.velocityY * dt; }
            
            let baseFloorLevel = isCrouching ? 0.6 : 1.6;
            if (player.position.z <= -200 && player.position.y >= 10.0) { baseFloorLevel = 11.0 + (isCrouching ? 0.6 : 1.6); }

            if (inLavaHole && !onPlatform && !trapCooldown) {
                if (player.position.y <= 1.6) { trapCooldown = true; player.velocityY = 0; instBar.innerHTML = "❌ سقطت في حفرة اللافا!"; respawnOutsideMuseum(); }
            }

            if (player.position.y <= baseFloorLevel && !onPlatform) { player.position.y = baseFloorLevel; player.velocityY = 0; player.isGrounded = true; }

            let moveSpeed = isRunning ? 16.0 : 9.5; if (isCrouching) moveSpeed = 4.0;
            camera.rotation.x = player.pitch; camera.rotation.y = player.yaw;

            if (moveX !== 0 || moveZ !== 0) {
                let dirX = Math.sin(player.yaw) * moveZ + Math.sin(player.yaw - Math.PI/2) * -moveX;
                let dirZ = Math.cos(player.yaw) * moveZ + Math.cos(player.yaw - Math.PI/2) * -moveX;
                let nextX = player.position.x + dirX * moveSpeed * dt; let nextZ = player.position.z + dirZ * moveSpeed * dt;
                let canMoveX = true, canMoveZ = true;

                let tBoxX = new THREE.Box3(new THREE.Vector3(nextX - player.radius, player.position.y - 1.2, player.position.z - player.radius), new THREE.Vector3(nextX + player.radius, player.position.y + 1.2, player.position.z + player.radius));
                for (let i = 0; i < colliders.length; i++) { if (tBoxX.intersectsBox(colliders[i])) { canMoveX = false; break; } }

                let tBoxZ = new THREE.Box3(new THREE.Vector3(player.position.x - player.radius, player.position.y - 1.2, nextZ - player.radius), new THREE.Vector3(player.position.x + player.radius, player.position.y + 1.2, nextZ + player.radius));
                for (let i = 0; i < colliders.length; i++) { if (tBoxZ.intersectsBox(colliders[i])) { canMoveZ = false; break; } }

                if (canMoveX) player.position.x = nextX; if (canMoveZ) player.position.z = nextZ;
                if (player.isGrounded && (canMoveX || canMoveZ)) { footstepTimer += 60 * dt; if (footstepTimer > 22) { playFootstepSound(); footstepTimer = 0; } }
            }
            
            camera.position.copy(player.position);
            flashlight.position.copy(player.position);
            flashlightTarget.position.set(player.position.x - Math.sin(player.yaw)*5, player.position.y + Math.sin(player.pitch)*5, player.position.z - Math.cos(player.yaw)*5);

            closestInteractable = null;
            if (gameState === "search_gate_key") {
                if(player.position.distanceTo(goldenCardMesh.position) < 3.0) closestInteractable = { type: 'collect_golden_card', label: '💳 التقط الكرت الذهبي للمتحف' };
            } 
            else if (gameState === "unlock_main_gate") {
                if(player.position.distanceTo(new THREE.Vector3(0, player.position.y, -129)) < 5.0) closestInteractable = { type: 'open_museum_gate', label: '🏛️ افتح البوابة الفرعونية الكبرى' };
            } 
            else if (gameState === "explore_museum_first_floor") {
                for(let sym of collectableSymbols) {
                    if(!sym.collected) {
                        if(player.position.distanceTo(sym.mesh.position) < 3.0) { closestInteractable = { type: 'grab_symbol', symbolId: sym.id, label: `💠 التقط الرمز الملون المصلح (${sym.id})` }; break; }
                    }
                }
                if(!closestInteractable && shotgunChallengeDone === true) {
                    if(player.position.distanceTo(skySymbolMesh.position) < 3.5) closestInteractable = { type: 'grab_sky_symbol', label: '💠 التقط الرمز البنفسجي من فوق العمود' };
                }
                if(!closestInteractable) {
                    let boxPos = new THREE.Vector3(18, 0.75, -188);
                    let subDjPos = new THREE.Vector3(18, subDjMesh.position.y, -188);
                    let distToBox = player.position.distanceTo(boxPos);
                    let distToSubDj = player.position.distanceTo(subDjPos);
                    let distToStairGate = player.position.distanceTo(new THREE.Vector3(0, player.position.y, -194));

                    if (scene.getObjectById(goldBoxMesh.id) && distToBox < 3.5) closestInteractable = { type: 'open_gold_box', label: '📦 افتح الصندوق الخشبي' };
                    else if (!hasSubDJ && subDjMesh.position.y > 0 && distToSubDj < 3.0) closestInteractable = { type: 'collect_sub_dj', label: '🔊 التقط الـ DJ الفرعوني من الصندوق' };
                    else if (collectedSymbolsCount === 4 && !isStairGateOpen && distToStairGate < 4.5) closestInteractable = { type: 'place_symbols_and_open_gate', label: '🛑 رص الرموز لفتح بوابة السلم' };
                }
            }
            else if (player.position.z < -240 && player.position.y >= 10.0) {
                if(player.position.distanceTo(new THREE.Vector3(0, player.position.y, -254)) < 3.5) closestInteractable = { type: 'rescue_mona_victory', label: '🤝 تحرير منى والهروب فوراً وفك اللغز!' }; 
            }

            if (closestInteractable) {
                interactBtn.style.opacity = "1"; interactBtn.style.pointerEvents = "auto"; document.getElementById('interact-label').innerHTML = closestInteractable.label;
            } else {
                interactBtn.style.opacity = "0.3"; interactBtn.style.pointerEvents = "none"; document.getElementById('interact-label').innerHTML = 'تفاعل';
            }

            renderer.render(scene, camera);
        }
        
        clock.start();
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
